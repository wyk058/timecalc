<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>節目時間計算機</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --calc-bg: #ffffff;
      --screen-bg: #f8fafc;
      --screen-border: #cbd5e1;
      --btn-num: #ffffff;
      --btn-num-text: #0f172a;
      --btn-num-border: #cbd5e1;
      --btn-num-hover: #e2e8f0;
      --btn-op: #2563eb;
      --btn-op-text: #ffffff;
      --btn-op-hover: #1d4ed8;
      --btn-fn: #e2e8f0;
      --btn-fn-text: #334155;
      --btn-equal: #059669;
      --btn-equal-text: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", monospace;
    }

    /* 視窗極限鎖死，防止整頁滾動 */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 860px;
      height: 96%;
      max-height: 800px;
      background: var(--calc-bg);
      padding: 20px;
      border-radius: 28px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
      position: relative;
    }

    /* 計算機主要視窗 */
    .calculator {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      min-width: 0; /* 防止子元素撐爆 flex */
    }

    /* 螢幕顯示區 */
    .display-screen {
      background: var(--screen-bg);
      border-radius: 18px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px solid var(--screen-border);
      flex-shrink: 0;
      position: relative;
    }

    /* 手機版歷程快捷鈕（平時在右上角） */
    .mobile-hist-toggle {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      background: #e2e8f0;
      color: var(--text-main);
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      z-index: 5;
    }

    .expr-history {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-muted);
      min-height: 26px;
      text-align: center;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current-val {
      font-size: 4.2rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      text-align: center;
      width: 100%;
    }

    /* 鍵盤區：5 列排版自適應填滿 */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    button {
      border: 1.5px solid var(--btn-num-border);
      outline: none;
      border-radius: 14px;
      font-size: 2rem;
      font-weight: 800;
      color: var(--btn-num-text);
      background: var(--btn-num);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
      transition: background 0.1s, transform 0.05s;
    }

    button:active {
      transform: scale(0.95);
    }

    button.btn-num:hover { background: var(--btn-num-hover); }

    button.btn-op {
      background: var(--btn-op);
      color: var(--btn-op-text);
      border: none;
      font-size: 2.2rem;
    }
    button.btn-op:hover { background: var(--btn-op-hover); }

    button.btn-fn {
      background: var(--btn-fn);
      color: var(--btn-fn-text);
      border: 1.5px solid #cbd5e1;
      font-size: 1.6rem;
    }

    button.btn-equal {
      background: var(--btn-equal);
      color: var(--btn-equal-text);
      border: none;
      font-size: 2.4rem;
      grid-row: span 2;
      height: 100%;
    }

    /* 電腦/平板側邊欄 */
    .history-panel {
      flex: 0.9;
      background: var(--screen-bg);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      border: 2px solid var(--screen-border);
      height: 100%;
      min-width: 0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
      flex-shrink: 0;
    }

    .history-header span {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--text-main);
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .history-item {
      padding: 10px 12px;
      background: #ffffff;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .history-item .hist-eq {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 600;
      word-break: break-all;
    }

    .history-item .hist-res {
      color: var(--accent);
      font-weight: 900;
      font-size: 1.35rem;
    }

    /* 手機版全螢幕防破圖抽屜 */
    .drawer-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(15, 23, 42, 0.5);
      z-index: 999;
      justify-content: center;
      align-items: flex-end;
    }

    .drawer-content {
      width: 100%;
      max-height: 75dvh;
      background: #ffffff;
      border-radius: 20px 20px 0 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.15);
    }

    /* 手機版適配（< 720px） */
    @media (max-width: 720px) {
      body {
        padding: 0;
      }

      .wrapper {
        width: 100vw;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        border: none;
        padding: 12px;
      }

      /* 隱藏桌面側欄，避免壓縮破圖 */
      .history-panel {
        display: none;
      }

      /* 顯示歷程按鈕 */
      .mobile-hist-toggle {
        display: block;
      }

      .calculator {
        gap: 8px;
      }

      .display-screen {
        padding: 12px 10px;
      }

      .current-val {
        font-size: 3.4rem;
      }

      .keypad {
        gap: 8px;
      }

      button {
        border-radius: 12px;
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- 計算機主面板 -->
  <div class="calculator">
    <div class="display-screen">
      <button class="mobile-hist-toggle" onclick="toggleDrawer(true)">📋 歷程</button>
      <div class="expr-history" id="exprDisplay"></div>
      <div class="current-val" id="valDisplay">00:00</div>
    </div>

    <div class="keypad">
      <!-- Row 1 -->
      <button class="btn-fn" onclick="pressClear()">AC</button>
      <button class="btn-fn" onclick="pressBackspace()">⌫</button>
      <button class="btn-op" onclick="pressOp('÷')">÷</button>
      <button class="btn-op" onclick="pressOp('×')">×</button>

      <!-- Row 2 -->
      <button class="btn-num" onclick="pressDigit('7')">7</button>
      <button class="btn-num" onclick="pressDigit('8')">8</button>
      <button class="btn-num" onclick="pressDigit('9')">9</button>
      <button class="btn-op" onclick="pressOp('-')">−</button>

      <!-- Row 3 -->
      <button class="btn-num" onclick="pressDigit('4')">4</button>
      <button class="btn-num" onclick="pressDigit('5')">5</button>
      <button class="btn-num" onclick="pressDigit('6')">6</button>
      <button class="btn-op" onclick="pressOp('+')">+</button>

      <!-- Row 4 & 5 -->
      <button class="btn-num" onclick="pressDigit('1')">1</button>
      <button class="btn-num" onclick="pressDigit('2')">2</button>
      <button class="btn-num" onclick="pressDigit('3')">3</button>
      <button class="btn-equal" onclick="pressEqual()">=</button>

      <button class="btn-num" onclick="pressDigit('0')" style="grid-column: span 2;">0</button>
      <button class="btn-num" onclick="pressDigit('00')">00</button>
    </div>
  </div>

  <!-- 電腦/平板常設右側欄 -->
  <div class="history-panel">
    <div class="history-header">
      <span>計算歷程 (Rundown)</span>
      <button class="clear-btn" onclick="clearHistory()">清空</button>
    </div>
    <div class="history-list" id="desktopHistoryList"></div>
  </div>
</div>

<!-- 手機防破圖專用抽屜 -->
<div class="drawer-overlay" id="mobileDrawer" onclick="toggleDrawer(false)">
  <div class="drawer-content" onclick="event.stopPropagation()">
    <div class="history-header">
      <span>計算歷程</span>
      <div style="display:flex; gap:16px;">
        <button class="clear-btn" onclick="clearHistory()">清空</button>
        <button class="clear-btn" style="color:var(--text-main);" onclick="toggleDrawer(false)">關閉</button>
      </div>
    </div>
    <div class="history-list" id="mobileHistoryList" style="max-height: 60dvh;"></div>
  </div>
</div>

<script>
  let digits = "";
  let storedSec = null;
  let pendingOp = null;
  let isNewEntry = true;

  const valDisplay = document.getElementById("valDisplay");
  const exprDisplay = document.getElementById("exprDisplay");
  const desktopHistoryList = document.getElementById("desktopHistoryList");
  const mobileHistoryList = document.getElementById("mobileHistoryList");
  const mobileDrawer = document.getElementById("mobileDrawer");

  function digitsToTime(str) {
    if (!str || str === "0") return { m: 0, s: 0, formatted: "00:00", totalSec: 0 };
    const padded = str.padStart(4, "0");
    const s = parseInt(padded.slice(-2), 10);
    const m = parseInt(padded.slice(0, -2), 10);
    const totalSec = m * 60 + s;
    const formatted = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    return { m, s, formatted, totalSec };
  }

  function formatSeconds(totalSec) {
    const isNeg = totalSec < 0;
    const abs = Math.abs(totalSec);
    const m = Math.floor(abs / 60);
    const s = abs % 60;
    const res = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    return isNeg ? `-${res}` : res;
  }

  function renderCurrentInput() {
    valDisplay.textContent = digits === "" ? "00:00" : digitsToTime(digits).formatted;
  }

  function pressDigit(d) {
    if (isNewEntry) {
      digits = "";
      isNewEntry = false;
    }
    if (digits === "" && (d === "0" || d === "00")) return;
    if (digits.length >= 6) return;
    digits += d;
    renderCurrentInput();
  }

  function pressBackspace() {
    if (isNewEntry) return;
    digits = digits.slice(0, -1);
    renderCurrentInput();
  }

  function pressClear() {
    digits = "";
    storedSec = null;
    pendingOp = null;
    isNewEntry = true;
    exprDisplay.textContent = "";
    valDisplay.textContent = "00:00";
  }

  function pressOp(op) {
    const currentSec = digits === "" ? 0 : digitsToTime(digits).totalSec;
    if (storedSec === null) {
      storedSec = currentSec;
    } else if (!isNewEntry && pendingOp) {
      storedSec = executeCalc(storedSec, currentSec, pendingOp);
    }
    pendingOp = op;
    isNewEntry = true;
    exprDisplay.textContent = `${formatSeconds(storedSec)} ${op}`;
    valDisplay.textContent = formatSeconds(storedSec);
  }

  function executeCalc(a, b, op) {
    switch (op) {
      case '+': return a + b;
      case '-': return a - b;
      case '×': {
        const factor = digits !== "" ? parseInt(digits, 10) : b;
        return a * factor;
      }
      case '÷': {
        const divisor = digits !== "" ? parseInt(digits, 10) : b;
        return divisor !== 0 ? Math.round(a / divisor) : 0;
      }
      default: return b;
    }
  }

  function pressEqual() {
    if (pendingOp === null || storedSec === null) return;
    const currentSec = digits === "" ? 0 : digitsToTime(digits).totalSec;
    const resultSec = executeCalc(storedSec, currentSec, pendingOp);

    let secondOperandText = formatSeconds(currentSec);
    if (pendingOp === '×' || pendingOp === '÷') secondOperandText = digits || "1";

    const fullExpr = `${formatSeconds(storedSec)} ${pendingOp} ${secondOperandText}`;
    addHistory(fullExpr, formatSeconds(resultSec));

    exprDisplay.textContent = `${fullExpr} =`;
    valDisplay.textContent = formatSeconds(resultSec);

    storedSec = resultSec;
    pendingOp = null;
    digits = "";
    isNewEntry = true;
  }

  function addHistory(eq, res) {
    // 桌面版側欄
    const item1 = document.createElement("div");
    item1.className = "history-item";
    item1.innerHTML = `<span class="hist-eq">${eq}</span><span class="hist-res">= ${res}</span>`;
    desktopHistoryList.prepend(item1);

    // 手機抽屜版
    const item2 = item1.cloneNode(true);
    mobileHistoryList.prepend(item2);
  }

  function clearHistory() {
    desktopHistoryList.innerHTML = "";
    mobileHistoryList.innerHTML = "";
  }

  function toggleDrawer(show) {
    mobileDrawer.style.display = show ? "flex" : "none";
  }

  // 實體鍵盤支援
  window.addEventListener("keydown", (e) => {
    if (e.key >= '0' && e.key <= '9') pressDigit(e.key);
    else if (e.key === '+') pressOp('+');
    else if (e.key === '-') pressOp('-');
    else if (e.key === '*') pressOp('×');
    else if (e.key === '/') { e.preventDefault(); pressOp('÷'); }
    else if (e.key === 'Enter' || e.key === '=') pressEqual();
    else if (e.key === 'Backspace') pressBackspace();
    else if (e.key === 'Escape') pressClear();
  });
</script>

</body>
</html>
